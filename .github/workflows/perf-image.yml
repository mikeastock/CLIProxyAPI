name: perf-image

# Builds the linux/arm64 image the Buildr CLIProxyAPI host runs, tagged with
# the commit SHA. The host pins it by digest in bizops-infra (cliproxy.tf).

on:
  push:
    branches:
      - perf/claude-request-scans
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: perf-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/mikeastock/cliproxyapi
  UPSTREAM_REPOSITORY: https://github.com/router-for-me/CLIProxyAPI.git

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Refresh models catalog
        run: bash .github/scripts/refresh-model-catalogs.sh
      - name: Generate build metadata
        # The fork carries no tags, so name the build after the nearest
        # upstream release tag it is based on.
        run: |
          git fetch --no-tags --quiet "$UPSTREAM_REPOSITORY" '+refs/tags/v*:refs/tags/v*'
          base_version="$(git describe --tags --abbrev=0 --match 'v*' HEAD)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          {
            echo "VERSION=${base_version}+perf.${short_sha}"
            echo "COMMIT=${short_sha}"
            echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_ENV"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ env.COMMIT }}
            BUILD_DATE=${{ env.BUILD_DATE }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.VERSION }}
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
      - name: Summary
        run: |
          {
            echo "### ${IMAGE}:${GITHUB_SHA}"
            echo
            echo "Version: \`${VERSION}\`"
            echo
            echo "Pin: \`${IMAGE}:${GITHUB_SHA}@${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
